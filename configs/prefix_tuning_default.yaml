experiment:
  seed: 42
  seeds: [97, 98, 99]
  output_dir: results/runs/prefix_tuning

data:
  dataset_csv: data/raw/subcellular_localization.csv

model:
  model_name: Rostlab/prot_t5_xl_uniref50
  max_length: 1024
  prefix_length: 20
  dropout: 0.1
  freeze_backbone: true

train:
  batch_size: 2
  eval_batch_size: 2
  epochs: 5
  lr: 0.0005
  weight_decay: 0.0
  grad_clip_norm: 1.0
  num_workers: 0

results:
  prefix_runs_csv: results/prefix_tuning_runs.csv
  summary_json: results/summary_prefix_tuning.json
